name: Tests

# Runs the tests and clippy on every pull request and on the branches below, on Windows.
# Not for changes only to the README, which the code doesn't use.
on:
  pull_request:
    paths-ignore: [README.md, docs/**, site/**]
  push:
    branches: [main, fastube]
    paths-ignore: [README.md, docs/**, site/**]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch replaces a run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Test
        run: cargo test --locked

      # Also when a test failed, so one run shows both.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
