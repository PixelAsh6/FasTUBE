name: Release

# Builds the Windows x64 installer and portable zip from a tagged source with the fully
# optimized release profile (fat LTO, one codegen unit, stripped), and attaches both to
# the GitHub release for that tag. The asset names are what the app's updater looks
# for: fastube-setup-<version>.exe and fastube-portable-<version>.zip, where <version>
# is the tag without its v.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      # The tag must name the crate's own version: v1.0.0 releases 1.0.0.
      - name: Check the tag matches the crate
        shell: bash
        working-directory: windows
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "Cargo.toml $cargo_ver, tag ${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_NAME#v}" = "$cargo_ver" ] || { echo "tag ${GITHUB_REF_NAME} does not match v$cargo_ver"; exit 1; }

      - name: Build
        working-directory: windows
        run: cargo build --release --locked

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer and the portable zip
        working-directory: windows
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" installer\fastube.iss
          if ($LASTEXITCODE) { exit 1 }
          $out = "installer\Output\portable"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "target\release\fastube.exe", "installer\portable.txt", "..\README.md", "..\LICENSE" $out
          & "$env:SystemRoot\System32\tar.exe" -a -c -f "installer\Output\fastube-portable-$env:VERSION.zip" -C $out fastube.exe portable.txt README.md LICENSE
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/upload-artifact@v5
        with:
          name: windows-x64
          path: |
            windows/installer/Output/fastube-setup-${{ env.VERSION }}.exe
            windows/installer/Output/fastube-portable-${{ env.VERSION }}.zip
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: windows-x64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "FasTUBE ${{ github.ref_name }}" --notes "FasTUBE ${{ github.ref_name }}: the Windows x64 setup and the portable zip." fastube-setup-*.exe fastube-portable-*.zip
